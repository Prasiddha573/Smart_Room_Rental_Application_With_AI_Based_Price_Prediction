name: smart_room
description: "Smart Room app with chat, maps, Firebase & Supabase"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Localization (pins intl correctly)
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  lottie: ^3.3.2
  shimmer: ^3.0.0
  fluttertoast: ^8.2.4
  awesome_snackbar_content: ^0.1.8
  persistent_bottom_nav_bar: ^6.2.1

  # State Management
  get: ^4.7.3

  # Firebase (COMPATIBLE SET)
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0

  # Supabase
  supabase_flutter: ^2.12.0

  # Media & Images
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  transparent_image: ^2.0.1

  # Location & Maps
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_map_marker_popup: ^8.1.0
  google_maps_flutter: ^2.14.0
  flutter_polyline_points: ^3.1.0

  # Network & Utilities
  http: ^1.6.0
  url_launcher: ^6.3.2
  intl_phone_field: ^3.2.0
  path_provider: ^2.1.3
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/smart_room_icon.png"
